name: Bug report
description: Report a problem with Net-Sift
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what went wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: net-sift doctor output
      description: Paste the output of `net-sift doctor`. Remove anything sensitive.
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `net-sift --version`, plus OS and Python version.
    validations:
      required: true
