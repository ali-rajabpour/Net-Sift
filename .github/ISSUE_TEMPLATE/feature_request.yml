name: Feature request
description: Suggest an idea or a new source for Net-Sift
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Net-Sift does not support yet?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should it do? For a new source, link its public API or access method.
    validations:
      required: true
